name: Conan CI

on:
  pull_request:
    paths:
      - "conanfile.py"
      - ".github/workflows/conan.yml"
  push:
    branches: [main]
    paths:
      - "conanfile.py"
      - ".github/workflows/conan.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CC: gcc-15
      CXX: g++-15
      CONAN_HOME: ${{ github.workspace }}/.conan2

    steps:
      - uses: actions/checkout@v6

      - name: Configure git for private subprojects
        if: env.SUBPROJECT_PAT != ''
        shell: bash
        env:
          SUBPROJECT_PAT: ${{ secrets.SUBPROJECT_PAT }}
        run: git config --global url."https://x-access-token:${SUBPROJECT_PAT}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install tools
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15 libreadline-dev
          python -m pip install meson ninja conan

      - name: Configure Conan
        run: |
          conan profile detect
          profile=$(conan profile path default)
          echo "compiler.cppstd=26" >> "$profile"
          echo "build_type=Debug" >> "$profile"
          # Pin catch2 to settings that have prebuilt ConanCenter binaries
          # (Release only; gcc 11 / C++17). libstdc++ is ABI-stable across
          # these versions, so linking it into a GCC 15 Debug build is fine.
          echo "catch2/*:compiler.version=11" >> "$profile"
          echo "catch2/*:compiler.cppstd=17" >> "$profile"
          echo "catch2/*:build_type=Release" >> "$profile"
          conan profile show

      - name: Cache conan packages
        uses: actions/cache@v5
        with:
          path: ${{ env.CONAN_HOME }}/p
          key: conan-ubuntu-24.04-Debug-${{ hashFiles('conanfile.py', '.github/workflows/conan.yml') }}
          restore-keys: |
            conan-ubuntu-24.04-Debug-

      - name: Install Conan dependencies
        run: conan install . --output-folder=build/conan --build=missing

      - name: Trim conan cache
        run: conan cache clean "*" --source --build --temp

      - name: Select GCC 15 for Meson
        run: |
          cat > build/compiler.ini <<'EOF'
          [binaries]
          c = 'gcc-15'
          cpp = 'g++-15'
          EOF

      - name: Configure
        run: >
          meson setup build
          --wrap-mode=forcefallback
          --native-file build/conan/conan_meson_native.ini
          --native-file build/compiler.ini
          -Dvisualization=false
          -Dqt=false
          -Dexamples=false

      - name: Build and test
        shell: bash
        run: |
          meson compile -C build
          source build/conan/conanrun.sh
          meson test -C build -v
